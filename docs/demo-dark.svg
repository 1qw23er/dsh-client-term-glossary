<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 背景：模拟 DSH 深色界面 -->
  <rect width="920" height="440" fill="#1a1b1e"/>
  <!-- 顶部栏 -->
  <rect width="920" height="44" fill="#212226"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="22" r="6" fill="#febc2e"/>
  <circle cx="70" cy="22" r="6" fill="#28c840"/>
  <text x="460" y="27" fill="#8a8f99" font-size="13" text-anchor="middle">DeepSeek Harness · Web</text>

  <!-- 对话区：用户消息 -->
  <rect x="40" y="76" width="420" height="52" rx="10" fill="#25262a" stroke="#33343a"/>
  <text x="60" y="100" fill="#8a8f99" font-size="12">你</text>
  <text x="60" y="118" fill="#e5e6eb" font-size="14">帮我把这个任务拆成几个子任务并行跑一下</text>

  <!-- 对话区：助手回复（含被选中的术语） -->
  <rect x="40" y="148" width="560" height="150" rx="10" fill="#25262a" stroke="#33343a"/>
  <text x="60" y="172" fill="#8a8f99" font-size="12">助手</text>
  <text x="60" y="196" fill="#e5e6eb" font-size="14">好的，我会派几个 </text>
  <!-- 选中高亮 -->
  <rect x="186" y="182" width="86" height="19" rx="3" fill="#2f6feb" opacity="0.45"/>
  <text x="188" y="196" fill="#e5e6eb" font-size="14" font-weight="600">subagent</text>
  <text x="272" y="196" fill="#e5e6eb" font-size="14"> 去并行处理：</text>
  <text x="60" y="222" fill="#e5e6eb" font-size="14">· 一个负责梳理需求</text>
  <text x="60" y="246" fill="#e5e6eb" font-size="14">· 一个负责查资料</text>
  <text x="60" y="270" fill="#e5e6eb" font-size="14">每个干完就把结果交回来，我再汇总。</text>

  <!-- 连线：从选中处到卡片 -->
  <path d="M 280 192 C 330 192, 350 210, 400 210" stroke="#3a3a3c" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- 解释卡片（深色主题，精确复刻插件样式） -->
  <g filter="url(#cardshadow)">
    <rect x="404" y="120" width="360" height="298" rx="12" fill="#25262a" stroke="#3a3a3c" stroke-width="1"/>

    <!-- 关闭按钮 -->
    <text x="744" y="146" fill="#8a8f99" font-size="18" text-anchor="middle">×</text>

    <!-- 标题 -->
    <text x="424" y="148" fill="#e5e6eb" font-size="15" font-weight="600">subagent</text>

    <!-- 字段 1：一句话 -->
    <text x="424" y="180" fill="#8a8f99" font-size="12.5">一句话</text>
    <text x="492" y="180" fill="#e5e6eb" font-size="14">主助手派出去的“临时小帮手”，</text>
    <text x="492" y="200" fill="#e5e6eb" font-size="14">只干一件独立小活，干完就退场。</text>

    <!-- 字段 2：打比方 -->
    <text x="424" y="232" fill="#8a8f99" font-size="12.5">打比方</text>
    <text x="492" y="232" fill="#e5e6eb" font-size="14">你正忙着，叫个小弟去跑腿取快递；</text>
    <text x="492" y="252" fill="#e5e6eb" font-size="14">他取完把东西交给你就走。</text>

    <!-- 字段 3：在 DSH 里 -->
    <text x="424" y="284" fill="#8a8f99" font-size="12.5">在 DSH 里</text>
    <text x="492" y="284" fill="#e5e6eb" font-size="14">主助手忙不过来、或想把一件事</text>
    <text x="492" y="304" fill="#e5e6eb" font-size="14">单独交给干净小帮手时用它。</text>

    <!-- 分隔虚线 -->
    <line x1="424" y1="324" x2="744" y2="324" stroke="#2e2e30" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="424" y="346" fill="#8a8f99" font-size="12.5">不用记。知道“是临时帮手”就行。</text>

    <!-- 分隔虚线（按钮区） -->
    <line x1="424" y1="362" x2="744" y2="362" stroke="#2e2e30" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- 按钮：➕ 加词 -->
    <rect x="424" y="374" width="68" height="26" rx="6" fill="#2a2a2e" stroke="#3a3a3c"/>
    <text x="458" y="391" fill="#e5e6eb" font-size="12.5" text-anchor="middle">➕ 加词</text>

    <!-- 按钮：🔊 朗读 -->
    <rect x="500" y="374" width="76" height="26" rx="6" fill="#2a2a2e" stroke="#3a3a3c"/>
    <text x="538" y="391" fill="#e5e6eb" font-size="12.5" text-anchor="middle">🔊 朗读</text>

    <!-- 按钮：复制 -->
    <rect x="584" y="374" width="44" height="26" rx="6" fill="#2a2a2e" stroke="#3a3a3c"/>
    <text x="606" y="391" fill="#e5e6eb" font-size="12.5" text-anchor="middle">复制</text>

    <!-- 按钮：✍️ 填入输入框（主按钮，蓝色） -->
    <rect x="636" y="374" width="110" height="26" rx="6" fill="#2f6feb" stroke="#2f6feb"/>
    <text x="691" y="391" fill="#ffffff" font-size="12.5" text-anchor="middle">✍️ 填入输入框</text>
  </g>

  <!-- 底部说明 -->
  <text x="820" y="428" fill="#5a5f6a" font-size="11" text-anchor="end">dsh-client-term-glossary</text>
</svg>
