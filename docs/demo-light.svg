<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="cardshadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- 背景：模拟 DSH 浅色界面 -->
  <rect width="920" height="440" fill="#f7f8fa"/>
  <!-- 顶部栏 -->
  <rect width="920" height="44" fill="#ffffff"/>
  <line x1="0" y1="44" x2="920" y2="44" stroke="#e5e6eb"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="22" r="6" fill="#febc2e"/>
  <circle cx="70" cy="22" r="6" fill="#28c840"/>
  <text x="460" y="27" fill="#8a8f99" font-size="13" text-anchor="middle">DeepSeek Harness · Web</text>

  <!-- 对话区：用户消息 -->
  <rect x="40" y="76" width="420" height="52" rx="10" fill="#ffffff" stroke="#e5e6eb"/>
  <text x="60" y="100" fill="#8a8f99" font-size="12">你</text>
  <text x="60" y="118" fill="#1f2329" font-size="14">这个项目的依赖装不上，报错了</text>

  <!-- 对话区：助手回复（含命令组合） -->
  <rect x="40" y="148" width="560" height="150" rx="10" fill="#ffffff" stroke="#e5e6eb"/>
  <text x="60" y="172" fill="#8a8f99" font-size="12">助手</text>
  <text x="60" y="196" fill="#1f2329" font-size="14">先试试在项目目录跑 </text>
  <!-- 选中高亮 -->
  <rect x="204" y="182" width="104" height="19" rx="3" fill="#2f6feb" opacity="0.28"/>
  <text x="206" y="196" fill="#1f2329" font-size="14" font-weight="600">npm install</text>
  <text x="310" y="196" fill="#1f2329" font-size="14"> 装一下：</text>
  <text x="60" y="222" fill="#1f2329" font-size="14">如果还是不行，把完整报错发我看看。</text>
  <text x="60" y="246" fill="#8a8f99" font-size="13">（依赖没装好是新手最常见的问题）</text>

  <!-- 连线 -->
  <path d="M 308 192 C 350 192, 360 210, 400 210" stroke="#dcdee0" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- 解释卡片（浅色主题，精确复刻插件样式） -->
  <g filter="url(#cardshadowL)">
    <rect x="404" y="120" width="360" height="286" rx="12" fill="#ffffff" stroke="#e5e6eb" stroke-width="1"/>

    <!-- 关闭按钮 -->
    <text x="744" y="146" fill="#8a8f99" font-size="18" text-anchor="middle">×</text>

    <!-- 标题（命令组合） -->
    <text x="424" y="148" fill="#1f2329" font-size="15" font-weight="600">npm install</text>

    <!-- 字段 1 -->
    <text x="424" y="180" fill="#8a8f99" font-size="12.5">一句话</text>
    <text x="492" y="180" fill="#1f2329" font-size="14">安装项目所需的依赖包。</text>

    <!-- 字段 2 -->
    <text x="424" y="214" fill="#8a8f99" font-size="12.5">打比方</text>
    <text x="492" y="214" fill="#1f2329" font-size="14">像装修队说买材料，把所有要用</text>
    <text x="492" y="234" fill="#1f2329" font-size="14">的零件运到工地。</text>

    <!-- 字段 3 -->
    <text x="424" y="268" fill="#8a8f99" font-size="12.5">在 DSH 里</text>
    <text x="492" y="268" fill="#1f2329" font-size="14">克隆项目后先跑一次，</text>
    <text x="492" y="288" fill="#1f2329" font-size="14">装好所有依赖。</text>

    <!-- 分隔虚线 -->
    <line x1="424" y1="308" x2="744" y2="308" stroke="#eceef2" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="424" y="330" fill="#8a8f99" font-size="12.5">记一句：装依赖。</text>

    <!-- 分隔虚线（按钮区） -->
    <line x1="424" y1="346" x2="744" y2="346" stroke="#eceef2" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- 按钮：➕ 加词 -->
    <rect x="424" y="358" width="68" height="26" rx="6" fill="#f2f3f5" stroke="#e5e6eb"/>
    <text x="458" y="375" fill="#1f2329" font-size="12.5" text-anchor="middle">➕ 加词</text>

    <!-- 按钮：🔊 朗读 -->
    <rect x="500" y="358" width="76" height="26" rx="6" fill="#f2f3f5" stroke="#e5e6eb"/>
    <text x="538" y="375" fill="#1f2329" font-size="12.5" text-anchor="middle">🔊 朗读</text>

    <!-- 按钮：复制 -->
    <rect x="584" y="358" width="44" height="26" rx="6" fill="#f2f3f5" stroke="#e5e6eb"/>
    <text x="606" y="375" fill="#1f2329" font-size="12.5" text-anchor="middle">复制</text>

    <!-- 按钮：✍️ 填入输入框（主按钮，蓝色） -->
    <rect x="636" y="358" width="110" height="26" rx="6" fill="#2f6feb" stroke="#2f6feb"/>
    <text x="691" y="375" fill="#ffffff" font-size="12.5" text-anchor="middle">✍️ 填入输入框</text>
  </g>

  <!-- 底部说明 -->
  <text x="820" y="428" fill="#a8adb8" font-size="11" text-anchor="end">dsh-client-term-glossary</text>
</svg>
